[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dma"
version = "0.1.0"
description = "Direct Message Approximation (DMA) Gaussian messages for product and leaky-ReLU factors (arXiv:2609.29466)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = ["jax>=0.4.30", "jaxlib", "numpy"]

[project.optional-dependencies]
tests = ["pytest>=7"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
